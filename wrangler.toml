name = "surya-ai-worker"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Public variables (kept in Wrangler config). Secrets stay in
# the Cloudflare dashboard or wrangler secret put.
NEXT_PUBLIC_APP_URL = "https://www.suryaai.in"
